<div class="admin-team-wrapper">
  
  <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
    <div>
      <h3 class="fw-black text-dark mb-1">Designers & Architects Team</h3>
      <p class="text-muted mb-0 font-size-xs">Manage interior architects, project managers, and studio team profiles</p>
    </div>

    <button type="button" class="btn btn-maroon-primary rounded-3 px-3.5 py-2 font-size-xs font-weight-bold text-white shadow-xs d-inline-flex align-items-center gap-2" (click)="openAddModal()">
      <i class="fa-solid fa-user-plus"></i>
      <span>Add Team Member</span>
    </button>
  </div>

  <div class="row g-4">
    <div *ngFor="let m of teamMembers" class="col-12 col-md-6 col-lg-4">
      <div class="team-card bg-white rounded-2 border border-gray-200 overflow-hidden shadow-xs h-100 d-flex flex-column justify-content-between">
        <div>
          <div class="team-img-box position-relative overflow-hidden" style="height: 200px;">
            <img [src]="m.photo" [alt]="m.name" class="w-100 h-100 object-fit-cover">
            <span class="badge rounded-1 bg-maroon text-white font-size-micro font-weight-bold position-absolute top-0 end-0 m-3 px-2.5 py-1 shadow-sm">
              {{ m.experience }} Exp.
            </span>
          </div>

          <div class="p-3 px-4 py-3">
            <h5 class="fw-black text-dark font-size-base mb-0.5">{{ m.name }}</h5>
            <div class="font-size-xs font-weight-bold text-maroon mb-2">{{ m.role }}</div>
            <p class="font-size-xs text-muted mb-2">{{ m.bio }}</p>
            
            <div class="bg-light p-2 rounded-1 font-size-micro text-secondary font-weight-semibold">
              <i class="fa-solid fa-certificate me-1 text-maroon"></i>{{ m.specialization }}
            </div>
          </div>
        </div>

        <div class="p-3 bg-light border-top border-gray-200 text-end">
          <button type="button" class="btn btn-sm btn-outline-primary me-1 px-2.5 py-1 font-size-micro rounded-1" (click)="openEditModal(m)">Edit</button>
          <button type="button" class="btn btn-sm btn-outline-danger px-2.5 py-1 font-size-micro rounded-1" (click)="deleteMember(m.id)">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="admin-modal-overlay position-fixed top-0 start-0 w-100 h-100 z-1050 d-flex align-items-center justify-content-center p-3 bg-dark-glass" *ngIf="showModal()">
    <div class="admin-modal-card bg-white rounded-4 border border-gray-200 shadow-2xl w-100 max-w-550 overflow-hidden animate-zoom-in">
      
      <div class="modal-header p-3 px-4 bg-light border-bottom border-gray-200 d-flex align-items-center justify-content-between">
        <h6 class="m-0 fw-black text-dark font-size-base">
          {{ isEditing() ? 'Edit Team Profile' : 'Add Team Member' }}
        </h6>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>

      <form (submit)="saveMember($event)" class="p-4">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label font-size-xs font-weight-bold text-dark mb-1">Full Name</label>
            <input type="text" class="form-control font-size-xs rounded-3 border shadow-none" placeholder="e.g. Ar. Rajesh Malhotra" [ngModel]="name()" (ngModelChange)="name.set($event)" name="name" required>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label font-size-xs font-weight-bold text-dark mb-1">Designation / Role</label>
            <input type="text" class="form-control font-size-xs rounded-3 border shadow-none" placeholder="e.g. Principal Architect" [ngModel]="role()" (ngModelChange)="role.set($event)" name="role" required>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label font-size-xs font-weight-bold text-dark mb-1">Years of Experience</label>
            <input type="text" class="form-control font-size-xs rounded-3 border shadow-none" placeholder="e.g. 15+ Years" [ngModel]="experience()" (ngModelChange)="experience.set($event)" name="experience" required>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label font-size-xs font-weight-bold text-dark mb-1">Specialization</label>
            <input type="text" class="form-control font-size-xs rounded-3 border shadow-none" placeholder="e.g. VR Space Planning" [ngModel]="specialization()" (ngModelChange)="specialization.set($event)" name="specialization" required>
          </div>

          <div class="col-12">
            <label class="form-label font-size-xs font-weight-bold text-dark mb-1">Profile Photo URL</label>
            <input type="text" class="form-control font-size-xs rounded-3 border shadow-none" placeholder="/about_living_room_masterpiece.png" [ngModel]="photo()" (ngModelChange)="photo.set($event)" name="photo" required>
          </div>

          <div class="col-12">
            <label class="form-label font-size-xs font-weight-bold text-dark mb-1">Short Bio</label>
            <textarea class="form-control font-size-xs rounded-3 border shadow-none" rows="2" placeholder="Brief background about interior architecture experience..." [ngModel]="bio()" (ngModelChange)="bio.set($event)" name="bio"></textarea>
          </div>
        </div>

        <div class="d-flex align-items-center justify-content-end gap-2 mt-4 pt-3 border-top border-gray-200">
          <button type="button" class="btn btn-light rounded-3 px-3 py-2 font-size-xs font-weight-bold" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-maroon-primary rounded-3 px-4 py-2 font-size-xs font-weight-bold text-white shadow-xs">
            Save Profile
          </button>
        </div>
      </form>

    </div>
  </div>

</div>
