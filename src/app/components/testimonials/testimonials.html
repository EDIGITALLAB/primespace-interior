<section *ngIf="list.length > 0" class="testimonials-section bg-white position-relative py-4 py-md-5">
  <div class="container cards-container position-relative">

    <!-- Section Title (Centered) -->
    <div class="text-center mb-4 pb-2">
      <span class="section-subtitle text-uppercase mb-1 d-block font-size-xs fw-extrabold text-maroon tracking-wider">Client Stories</span>
      <h2 class="section-title fw-black text-uppercase m-0 text-dark">Voices of Satisfaction</h2>
    </div>

    <!-- Testimonials Slider Wrapper with Side Navigation Arrows -->
    <div class="testimonials-wrapper position-relative px-3 px-sm-4 px-md-5">

      <!-- Left Side Navigation Arrow (<) -->
      <button *ngIf="list.length > 3" 
              type="button" 
              class="btn btn-side-arrow arrow-prev rounded-circle shadow-md d-flex align-items-center justify-content-center position-absolute top-50 start-0 translate-middle-y z-3" 
              (click)="prevPage()" 
              aria-label="Previous Testimonial">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <!-- Right Side Navigation Arrow (>) -->
      <button *ngIf="list.length > 3" 
              type="button" 
              class="btn btn-side-arrow arrow-next rounded-circle shadow-md d-flex align-items-center justify-content-center position-absolute top-50 end-0 translate-middle-y z-3" 
              (click)="nextPage()" 
              aria-label="Next Testimonial">
        <i class="fa-solid fa-chevron-right"></i>
      </button>

      <!-- Testimonials Slider Viewport -->
      <div class="testimonials-slider-viewport overflow-hidden position-relative" 
           (touchstart)="onTouchStart($event)" 
           (touchend)="onTouchEnd($event)">

        <div class="testimonials-slider-track d-flex">

          <!-- 3 Cards ALWAYS Displayed Side-by-Side -->
          <div class="testimonial-page-slide w-100 flex-shrink-0">
            <div class="row g-4 justify-content-center align-items-stretch">
              <div *ngFor="let item of visibleCards" class="col-12 col-md-6 col-lg-4 d-flex">
                
                <div class="testimonial-card p-4 text-center w-100 h-100 d-flex flex-column position-relative bg-white rounded-4 border shadow-xs">
                  
                  <!-- Quote Icon Watermark -->
                  <div class="quote-watermark"><i class="fa-solid fa-quote-right"></i></div>

                  <!-- Rating Stars (Supports Full, Half & Empty Stars) -->
                  <div class="stars-wrapper mb-3 d-flex align-items-center justify-content-center">
                    <ng-container *ngFor="let s of [1, 2, 3, 4, 5]">
                      <i *ngIf="s <= (item.rating || 5)" class="fa-solid fa-star me-1" style="color: #f59e0b;"></i>
                      <i *ngIf="s > (item.rating || 5) && (s - 0.5) <= (item.rating || 5)" class="fa-solid fa-star-half-stroke me-1" style="color: #f59e0b;"></i>
                      <i *ngIf="(s - 0.5) > (item.rating || 5)" class="fa-solid fa-star me-1" style="color: #e2e8f0; opacity: 0.4;"></i>
                    </ng-container>
                  </div>

                  <!-- Review Text -->
                  <div class="review-text-wrap flex-grow-1 d-flex align-items-center justify-content-center mb-4">
                    <p class="review-text m-0">
                      "{{ item.review }}"
                    </p>
                  </div>

                  <!-- Card Footer Info -->
                  <div class="card-footer-info mt-auto">
                    <div class="card-divider mx-auto mb-3"></div>

                    <div class="client-avatar-wrap mx-auto mb-3">
                      <img [src]="item.avatar" [alt]="item.name" class="client-avatar-img w-100 h-100 object-fit-cover rounded-circle shadow-sm">
                    </div>

                    <h5 class="client-name mb-1 text-uppercase text-truncate">{{ item.name }}</h5>
                    <span class="client-location d-block mb-3 text-truncate">{{ item.location }}</span>
                    <span class="client-service text-uppercase text-truncate max-w-100">{{ item.service }}</span>
                  </div>

                </div>

              </div>
            </div>
          </div>

        </div>

      </div>

    </div>

  </div>
</section>
