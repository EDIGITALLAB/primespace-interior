<!-- Global Consultation Booking Popup Modal -->
<div class="consultation-modal-overlay d-flex align-items-center justify-content-center" *ngIf="consultationModalService.isOpen()" (click)="consultationModalService.close()">
  <div class="consultation-modal-card position-relative p-4 p-md-5 overflow-hidden rounded-4 shadow-lg" (click)="$event.stopPropagation()">
    
    <!-- Close Button -->
    <button type="button" class="btn-close-consultation d-flex align-items-center justify-content-center" (click)="consultationModalService.close()" aria-label="Close modal">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <!-- Header Block -->
    <div class="consultation-header-block mb-3 text-center px-1">
      <h3 class="consultation-title m-0 text-uppercase">
        Book Free Consultation
      </h3>
    </div>

    <!-- Form -->
    <form class="consultation-modal-form" (submit)="onModalFormSubmit($event, modalName.value, modalEmail.value, modalPhone.value, modalCity.value, modalDescription.value)">

      <!-- Full Name -->
      <div class="form-group mb-3">
        <label for="modalFullName" class="form-label font-size-xs text-uppercase">Full Name</label>
        <div class="input-icon-wrapper">
          <i class="fa-regular fa-user field-icon text-purple"></i>
          <input type="text" id="modalFullName" placeholder="Enter your full name" class="form-control modal-input with-icon" required #modalName>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group mb-3">
        <label for="modalEmailAddr" class="form-label font-size-xs text-uppercase">Email Address</label>
        <div class="input-icon-wrapper">
          <i class="fa-regular fa-envelope field-icon text-purple"></i>
          <input type="email" id="modalEmailAddr" placeholder="Enter your email address" class="form-control modal-input with-icon" required #modalEmail>
        </div>
      </div>

      <!-- Phone & Location (Side-by-Side in 1 Line) -->
      <div class="row g-2 mb-3">
        <!-- Phone -->
        <div class="col-6 form-group mb-0">
          <label for="modalPhoneNum" class="form-label font-size-xs text-uppercase">Phone Number</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-phone field-icon text-purple"></i>
            <input type="tel" id="modalPhoneNum" placeholder="10-digit number" class="form-control modal-input with-icon" maxlength="10" minlength="10" pattern="[0-9]{10}" inputmode="numeric" required #modalPhone>
          </div>
        </div>

        <!-- Location -->
        <div class="col-6 form-group mb-0">
          <label for="modalCitySelect" class="form-label font-size-xs text-uppercase">Location</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-location-dot field-icon text-purple"></i>
            <select id="modalCitySelect" class="form-select modal-input with-icon text-truncate" required #modalCity>
              <option value="" disabled selected>Select Location</option>
              <option value="Bangalore Studio (Medahalli)">Bangalore Studio (Medahalli)</option>
              <option value="Bhubaneswar Studio (Saheed Nagar)">Bhubaneswar Studio (Saheed Nagar)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Message / Details -->
      <div class="form-group mb-3">
        <label for="modalDescription" class="form-label font-size-xs text-uppercase">Message</label>
        <div class="input-icon-wrapper">
          <i class="fa-regular fa-comment-dots field-icon textarea-icon text-purple"></i>
          <textarea id="modalDescription" rows="3" placeholder="Tell us about your space type (e.g. 3BHK, Villa), timeline, or budget..." class="form-control modal-input with-icon" #modalDescription></textarea>
        </div>
      </div>


      <!-- Submit Button -->
      <div class="form-submit-container mb-0">
        <button type="submit" class="btn btn-modal-submit w-100 py-3 fw-black text-uppercase d-flex align-items-center justify-content-center gap-2" [disabled]="isSubmitting()">
          <span *ngIf="!isSubmitting()">SEND MESSAGE</span>
          <i *ngIf="!isSubmitting()" class="fa-solid fa-paper-plane"></i>
          <span *ngIf="isSubmitting()">SENDING...</span>
          <i *ngIf="isSubmitting()" class="fa-solid fa-spinner fa-spin"></i>
        </button>
      </div>

    </form>

  </div>
</div>
