<div class="confirm-modal-overlay position-fixed top-0 start-0 w-100 h-100 z-1050 d-flex align-items-center justify-content-center p-3 bg-dark-glass" *ngIf="isOpen">
  <div class="confirm-modal-card bg-white rounded-4 border border-gray-200 shadow-2xl w-100 max-w-400 overflow-hidden animate-zoom-in text-center p-4">
    
    <div class="icon-wrap mx-auto mb-3 rounded-circle d-flex align-items-center justify-content-center"
         [ngClass]="type === 'danger' ? 'bg-danger-subtle text-danger' : 'bg-warning-subtle text-warning'"
         style="width: 56px; height: 56px; font-size: 22px;">
      <i class="fa-solid" [ngClass]="type === 'danger' ? 'fa-triangle-exclamation' : 'fa-circle-exclamation'"></i>
    </div>

    <h5 class="fw-black text-dark mb-2">{{ title }}</h5>
    <p class="text-secondary font-size-xs leading-relaxed mb-4">
      {{ message }} <strong *ngIf="itemName">"{{ itemName }}"</strong>? This action cannot be undone.
    </p>

    <div class="d-flex align-items-center justify-content-center gap-3" style="gap: 12px !important;">
      <button type="button" class="btn btn-light rounded-3 px-3.5 py-2 font-size-xs font-weight-bold flex-grow-1" (click)="onCancel()">
        {{ cancelText }}
      </button>
      <button type="button" 
              class="btn rounded-3 px-3.5 py-2 font-size-xs font-weight-bold text-white shadow-xs flex-grow-1"
              [ngClass]="type === 'danger' ? 'btn-danger' : 'btn-warning'" 
              (click)="onConfirm()">
        {{ confirmText }}
      </button>
    </div>

  </div>
</div>
