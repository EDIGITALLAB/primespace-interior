<section class="design-categories-section py-5 bg-white position-relative">
  
  <!-- Curated Section Heading -->
  <div class="w-100 py-3">
    <div class="text-center mb-5 position-relative">
      <span class="section-subtitle text-uppercase mb-2">Curated Room Inspirations</span>
      <h2 class="section-title fw-medium text-uppercase m-0">Design Categories</h2>
    </div>
  </div>

  <div class="container-fluid px-5 cards-container position-relative">
    
    <!-- Left Navigation Button -->
    <button class="slide-nav-btn prev-btn" (click)="prevSlide()" [class.hidden]="currentSlide() === 0" aria-label="Previous Slide">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" class="bi bi-chevron-left" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
      </svg>
    </button>
    
    <!-- Viewport -->
    <div class="slider-viewport">
      <div class="slider-track" [style.transform]="'translateX(-' + (currentSlide() * 50) + '%)'">
        
        <!-- Slide 1: Kitchen, Dining, Bedroom, Living -->
        <div class="slider-slide">
          <div class="categories-grid grid-layout-a">
            <!-- Kitchen -->
            <div class="category-card kitchen-card">
              <img src="/kitchen_cat.png" alt="Kitchen Design" class="category-img">
              <div class="category-overlay">
                <div class="category-tag">
                  <h3 class="category-title">KITCHEN</h3>
                  <span class="category-sub">VIEW DESIGNS &rarr;</span>
                </div>
              </div>
            </div>

            <!-- Dining -->
            <div class="category-card dining-card">
              <img src="/dining_cat.png" alt="Dining Design" class="category-img">
              <div class="category-overlay">
                <div class="category-tag">
                  <h3 class="category-title">DINING</h3>
                  <span class="category-sub">VIEW DESIGNS &rarr;</span>
                </div>
              </div>
            </div>

            <!-- Bedroom -->
            <div class="category-card bedroom-card">
              <img src="/bedroom_cat.png" alt="Bedroom Design" class="category-img">
              <div class="category-overlay">
                <div class="category-tag">
                  <h3 class="category-title">BEDROOM</h3>
                  <span class="category-sub">VIEW DESIGNS &rarr;</span>
                </div>
              </div>
            </div>

            <!-- Living -->
            <div class="category-card living-card">
              <img src="/living_cat.png" alt="Living Design" class="category-img">
              <div class="category-overlay">
                <div class="category-tag">
                  <h3 class="category-title">LIVING</h3>
                  <span class="category-sub">VIEW DESIGNS &rarr;</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Slide 2: Wardrobe, Bathroom, Kids Room, Balcony (Alternate Style) -->
        <div class="slider-slide">
          <div class="categories-grid grid-layout-b">
            <!-- Wardrobe -->
            <div class="category-card wardrobe-card">
              <img src="/wardrobe_cat.png" alt="Wardrobe Design" class="category-img">
              <div class="category-overlay">
                <div class="category-tag">
                  <h3 class="category-title">WARDROBE</h3>
                  <span class="category-sub">VIEW DESIGNS &rarr;</span>
                </div>
              </div>
            </div>

            <!-- Bathroom -->
            <div class="category-card bathroom-card">
              <img src="/bathroom_cat.png" alt="Bathroom Design" class="category-img">
              <div class="category-overlay">
                <div class="category-tag">
                  <h3 class="category-title">BATHROOM</h3>
                  <span class="category-sub">VIEW DESIGNS &rarr;</span>
                </div>
              </div>
            </div>

            <!-- Kids Room -->
            <div class="category-card kids-card">
              <img src="/kids_cat.png" alt="Kids Room Design" class="category-img">
              <div class="category-overlay">
                <div class="category-tag">
                  <h3 class="category-title">KIDS ROOM</h3>
                  <span class="category-sub">VIEW DESIGNS &rarr;</span>
                </div>
              </div>
            </div>

            <!-- Balcony -->
            <div class="category-card balcony-card">
              <img src="/balcony_cat.png" alt="Balcony Design" class="category-img">
              <div class="category-overlay">
                <div class="category-tag">
                  <h3 class="category-title">BALCONY</h3>
                  <span class="category-sub">VIEW DESIGNS &rarr;</span>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Right Navigation Button -->
    <button class="slide-nav-btn next-btn" (click)="nextSlide()" [class.hidden]="currentSlide() === 1" aria-label="Next Slide">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" class="bi bi-chevron-right" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/>
      </svg>
    </button>
    
  </div>
</section>
