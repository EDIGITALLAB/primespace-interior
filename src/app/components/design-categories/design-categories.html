<section class="design-categories-section py-6 position-relative overflow-hidden">
  <!-- Subtle luxury background glow -->
  <div class="categories-glow-effect"></div>

  <div class="container cards-container position-relative" style="z-index: 2;">

    <!-- Section Header (Modern left-aligned heading with lead description) -->
    <div class="row mb-3 align-items-end">
      <div class="col-12">
        <span class="section-subtitle text-uppercase mb-2">Room Inspirations</span>
        <h2 class="section-title text-uppercase m-0">Explore Categories</h2>
      </div>
    </div>

    <!-- Main Interactive Container Row -->
    <div class="row gy-4 gy-lg-0 interactive-showcase-row align-items-stretch">

      <!-- Left Column: Navigation Sidebar List -->
      <div class="col-lg-4 sidebar-column">
        <div class="category-sidebar-list d-flex flex-column">

          <div *ngFor="let cat of categories; let i = index" class="sidebar-item d-flex align-items-center"
            [class.active]="activeIndex() === i" (mouseenter)="setActiveCategory(i)" (click)="setActiveCategory(i)">

            <span class="item-number me-3">{{ cat.num }}</span>
            <span class="item-name text-uppercase">{{ cat.name }}</span>
            <span class="active-indicator-bar"></span>

          </div>

        </div>
      </div>

      <!-- Right Column: Large Dynamic Preview Card -->
      <div class="col-lg-8 preview-column">
        <div class="showcase-preview-card position-relative overflow-hidden">

          <!-- Image layers for smooth cross-fading transition -->
          <div class="preview-images-container w-100 h-100 position-absolute top-0 start-0">
            <img *ngFor="let cat of categories; let i = index" [src]="cat.image" [alt]="cat.name"
              class="preview-img-layer w-100 h-100 position-absolute start-0 top-0"
              [class.active]="activeIndex() === i">
          </div>

          <!-- Bottom Glass Card Panel (Floating inside image container) -->
          <div *ngFor="let cat of categories; let i = index" [class.d-none]="activeIndex() !== i"
            [class.animate-entry]="activeIndex() === i" class="details-panel-container">

            <div class="preview-details-panel">
              <div class="details-content-wrapper">
                <span class="details-badge text-uppercase mb-1 d-inline-block">Bespoke Design</span>
                <h3 class="details-title text-uppercase mb-2">
                  {{ cat.name }} Inspiration
                </h3>
                <p class="details-desc text-muted mb-0">
                  {{ cat.desc }}
                </p>
              </div>
            </div>

          </div>

        </div>
      </div>

    </div>

  </div>
</section>
