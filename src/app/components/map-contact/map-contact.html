<section class="map-contact-section w-100 position-relative" id="map-contact-section">
  <div class="container-fluid p-0">
    <div class="row g-0 align-items-stretch">

      <!-- Full-Width Google Map & Experience Center Info Card Column -->
      <div class="col-12 map-container-column position-relative">
        <div class="map-wrapper w-100 position-relative" style="height: 520px;">

          <!-- Floating Studio Location Switcher Tabs (Top Right) -->
          <div class="studio-switcher-bar d-flex gap-2 position-absolute">
            <button *ngFor="let loc of locations" type="button" class="btn studio-tab-btn d-flex align-items-center"
              [class.active]="loc.id === activeLocationId" (click)="selectLocation(loc.id)">
              <i class="fa-solid fa-building-user me-1.5"></i>
              <span>{{ loc.city }} Studio</span>
            </button>
          </div>

          <iframe [src]="activeLocation.safeMapUrl" width="100%" height="100%" style="border:0;" allowfullscreen=""
            loading="lazy" referrerpolicy="no-referrer-when-downgrade" class="google-map-iframe">
          </iframe>
          <div class="map-overlay-vignette"></div>

          <!-- Floating Experience Center Glass Card -->
          <div class="map-info-card glass-card">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <div class="card-header-badge d-flex align-items-center">
                <i class="fa-solid fa-location-dot me-1 text-purple"></i>
                <span>EXPERIENCE CENTER</span>
                <span class="live-status-pill ms-2 d-none d-sm-inline-flex align-items-center">
                  <span class="pulse-ring"></span>
                  OPEN TODAY
                </span>
              </div>
            </div>

            <h5 class="studio-name fw-bold mb-1">{{ activeLocation.name }}</h5>
            <p class="studio-address mb-2">{{ activeLocation.address }}</p>

            <div
              class="studio-meta d-flex flex-column flex-sm-row justify-content-between align-items-sm-center pt-2 border-top border-secondary-subtle gap-1 mb-2">
              <span class="meta-item"><i class="fa-regular fa-clock me-1 text-purple"></i> {{ activeLocation.hours
                }}</span>
              <span class="meta-item"><i class="fa-solid fa-phone me-1 text-purple"></i> {{ activeLocation.phone
                }}</span>
            </div>

            <!-- Card Action Footer Buttons -->
            <div
              class="card-actions-row d-flex justify-content-between align-items-center pt-2 border-top border-secondary-subtle gap-2">
              <button type="button" class="btn btn-gallery-preview d-flex align-items-center"
                (click)="openStudioGallery()">
                <i class="fa-solid fa-camera-retro me-1.5 text-purple"></i>
                <span>View Photos ({{ galleryPhotos.length }})</span>
              </button>
              <a [href]="activeLocation.directionsUrl" target="_blank" rel="noopener noreferrer"
                class="btn btn-directions-sm d-flex align-items-center gap-1.5">
                <span>Directions</span>
                <i class="fa-solid fa-arrow-up-right-from-square font-size-micro"></i>
              </a>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Studio Photo Gallery Lightbox Modal -->
  <div class="gallery-modal-overlay d-flex align-items-center justify-content-center" *ngIf="showGalleryModal"
    (click)="closeStudioGallery()">
    <div class="gallery-modal-content p-3 p-md-4 position-relative" (click)="$event.stopPropagation()">

      <!-- Close Button -->
      <button type="button" class="btn-close-modal d-flex align-items-center justify-content-center"
        (click)="closeStudioGallery()" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <!-- Header -->
      <div class="modal-header-info mb-3">
        <span class="location-chip me-2"><i class="fa-solid fa-location-dot me-1"></i>{{ activeLocation.name }}</span>
        <h4 class="modal-title mt-1 mb-0">{{ galleryPhotos[activePhotoIndex].title }}</h4>
        <p class="modal-subtitle mb-0 opacity-75">{{ galleryPhotos[activePhotoIndex].subtitle }}</p>
      </div>

      <!-- Main Photo Display -->
      <div class="main-photo-stage position-relative mb-3 overflow-hidden rounded-3">
        <img [src]="galleryPhotos[activePhotoIndex].imageUrl" [alt]="galleryPhotos[activePhotoIndex].title"
          class="gallery-main-img w-100">

        <!-- Nav Arrows -->
        <button type="button" class="btn-photo-nav nav-prev d-flex align-items-center justify-content-center"
          (click)="prevPhoto()">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button type="button" class="btn-photo-nav nav-next d-flex align-items-center justify-content-center"
          (click)="nextPhoto()">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- Thumbnails Bar -->
      <div class="thumbnails-bar d-flex gap-2 justify-content-center overflow-x-auto py-1">
        <div *ngFor="let photo of galleryPhotos; let i = index"
          class="thumb-item position-relative rounded overflow-hidden" [class.active]="i === activePhotoIndex"
          (click)="selectPhoto(i)">
          <img [src]="photo.imageUrl" [alt]="photo.title" class="thumb-img">
        </div>
      </div>

    </div>
  </div>
</section>
