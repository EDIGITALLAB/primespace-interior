<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <!-- Option A: Luxury Geometric Starburst Monogram Pattern for Footer -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Concentric Starburst Ring (Center Left) -->
    <g transform="translate(350, 200)">
      <circle cx="0" cy="0" r="160" stroke-width="1" stroke-dasharray="4 6" opacity="0.5" />
      <circle cx="0" cy="0" r="120" stroke-width="1.2" />
      <circle cx="0" cy="0" r="70" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
      <circle cx="0" cy="0" r="25" stroke-width="1.5" />
      
      <!-- 8-Point Starburst Rays -->
      <line x1="0" y1="-180" x2="0" y2="180" stroke-width="1" opacity="0.4" />
      <line x1="-180" y1="0" x2="180" y2="0" stroke-width="1" opacity="0.4" />
      <line x1="-127" y1="-127" x2="127" y2="127" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.3" />
      <line x1="-127" y1="127" x2="127" y2="-127" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.3" />

      <!-- Center House Icon Geometry -->
      <path d="M -15 10 L -15 -8 L 0 -20 L 15 -8 L 15 10 Z" stroke-width="1.8" />
    </g>

    <!-- Concentric Starburst Ring (Center Right) -->
    <g transform="translate(1050, 200)">
      <circle cx="0" cy="0" r="160" stroke-width="1" stroke-dasharray="4 6" opacity="0.5" />
      <circle cx="0" cy="0" r="120" stroke-width="1.2" />
      <circle cx="0" cy="0" r="70" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
      <circle cx="0" cy="0" r="25" stroke-width="1.5" />
      
      <line x1="0" y1="-180" x2="0" y2="180" stroke-width="1" opacity="0.4" />
      <line x1="-180" y1="0" x2="180" y2="0" stroke-width="1" opacity="0.4" />
      
      <polygon points="0,-135 10,-125 0,-115 -10,-125" stroke-width="1.2" />
      <polygon points="0,135 10,125 0,115 -10,125" stroke-width="1.2" />
    </g>

    <!-- Horizontal Connecting Axis Grid Lines -->
    <line x1="0" y1="200" x2="1400" y2="200" stroke-width="1" stroke-dasharray="6 8" opacity="0.35" />
    <line x1="0" y1="80" x2="1400" y2="80" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.25" />
    <line x1="0" y1="320" x2="1400" y2="320" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.25" />

  </g>
</svg>
