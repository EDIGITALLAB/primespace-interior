<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&amp;family=Outfit:wght@400;600;700;800;900&amp;display=swap');
      
      .brand-prime {
        font-family: 'Outfit', 'Montserrat', sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #A60A38;
        letter-spacing: 2px;
      }
      .brand-space {
        font-family: 'Outfit', 'Montserrat', sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #0F0F12;
        letter-spacing: 2px;
      }
      .brand-interior {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: 20px;
        fill: #0F0F12;
        letter-spacing: 11px;
      }
      .brand-tagline {
        font-family: 'Montserrat', sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #1A1A1E;
        letter-spacing: 3.5px;
      }
    </style>
  </defs>

  <g transform="translate(10, 10)">
    <!-- House Outer Outline (Peak & Frame) -->
    <path d="M 52 38 L 115 6 L 178 38 L 178 116 L 10 116 L 10 74 L 85 36" fill="none" stroke="#A60A38" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Secondary Roof Inner Line -->
    <polyline points="46 72 108 40 166 70" fill="none" stroke="#A60A38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 4-point Sparkle Star Top Right -->
    <path d="M 152 20 Q 152 26 158 26 Q 152 26 152 32 Q 152 26 146 26 Q 152 26 152 20 Z" fill="#A60A38"/>
    
    <!-- Hanging Pendant Lamp -->
    <line x1="108" y1="6" x2="108" y2="44" stroke="#A60A38" stroke-width="2.5"/>
    <path d="M 98 44 C 98 40 118 40 118 44 Z" fill="#A60A38"/>
    <path d="M 103 44 C 103 48 113 48 113 44 Z" fill="#A60A38"/>
    
    <!-- Cozy Armchair Icon Bottom Left -->
    <path d="M 32 86 C 30 72 40 66 54 66 C 68 66 78 72 76 86 C 78 94 72 98 54 98 C 36 98 30 94 32 86 Z" fill="none" stroke="#A60A38" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 32 80 C 26 80 24 88 28 98 C 30 102 36 102 38 98 Z" fill="#A60A38"/>
    <path d="M 76 80 C 82 80 84 88 80 98 C 78 102 72 102 70 98 Z" fill="#A60A38"/>
    <!-- Chair Legs -->
    <line x1="34" y1="102" x2="28" y2="116" stroke="#A60A38" stroke-width="3" stroke-linecap="round"/>
    <line x1="74" y1="102" x2="80" y2="116" stroke="#A60A38" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="102" x2="38" y2="116" stroke="#A60A38" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="66" y1="102" x2="70" y2="116" stroke="#A60A38" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Potted Plant Bottom Center-Right -->
    <path d="M 116 98 L 120 116 L 132 116 L 136 98 Z" fill="#A60A38"/>
    <!-- Leaves -->
    <path d="M 126 98 C 120 90 106 88 108 80 C 114 80 124 88 126 98 Z" fill="#A60A38"/>
    <path d="M 126 98 C 132 90 146 88 144 80 C 138 80 128 88 126 98 Z" fill="#A60A38"/>
    <path d="M 126 98 C 126 86 122 76 126 72 C 130 76 126 86 126 98 Z" fill="#A60A38"/>
    
    <!-- Slanted Door/Wall Panel Right -->
    <path d="M 142 54 L 166 66 L 166 116 L 142 116 Z" fill="#A60A38"/>

    <!-- Vertical Separator Bar -->
    <line x1="192" y1="10" x2="192" y2="116" stroke="#A60A38" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography Right Column -->
  <g transform="translate(216, 52)">
    <!-- PRIME SPACE -->
    <text x="0" y="0" class="brand-prime">PRIME<tspan class="brand-space">SPACE</tspan></text>
    
    <!-- — INTERIOR — -->
    <g transform="translate(0, 32)">
      <line x1="0" y1="-7" x2="48" y2="-7" stroke="#A60A38" stroke-width="2.5" stroke-linecap="round"/>
      <text x="64" y="0" class="brand-interior">INTERIOR</text>
      <line x1="240" y1="-7" x2="288" y2="-7" stroke="#A60A38" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- BESPOKE LIVING & DESIGN STUDIO -->
    <text x="0" y="58" class="brand-tagline">BESPOKE LIVING &amp; DESIGN STUDIO</text>
  </g>
</svg>
