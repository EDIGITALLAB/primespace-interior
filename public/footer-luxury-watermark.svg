<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <!-- New Bespoke Dark-Theme Architectural & Furniture Vector Watermark for Footer -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 1. Background CAD Axis & Grid -->
    <g stroke-width="0.8" stroke-dasharray="4 8" opacity="0.4">
      <line x1="50" y1="80" x2="1350" y2="80" />
      <line x1="50" y1="200" x2="1350" y2="200" />
      <line x1="50" y1="320" x2="1350" y2="320" />
      <line x1="200" y1="20" x2="200" y2="380" />
      <line x1="700" y1="20" x2="700" y2="380" />
      <line x1="1200" y1="20" x2="1200" y2="380" />
    </g>

    <!-- 2. Left Side: Architectural Living Room Wireframe -->
    <g transform="translate(100, 100)" stroke-width="1.2">
      <!-- Sofa Lounge Outline -->
      <rect x="0" y="80" width="220" height="90" rx="8" />
      <rect x="15" y="90" width="90" height="70" rx="4" />
      <rect x="115" y="90" width="90" height="70" rx="4" />
      
      <!-- Coffee Table & Rug -->
      <rect x="50" y="200" width="120" height="45" rx="6" stroke-dasharray="3 3" />
      <line x1="30" y1="190" x2="190" y2="190" stroke-dasharray="2 4" />
    </g>

    <!-- 3. Center: Large Architectural Compass Dial Emblem -->
    <g transform="translate(700, 190)">
      <circle cx="0" cy="0" r="140" stroke-width="1" stroke-dasharray="3 4" opacity="0.6" />
      <circle cx="0" cy="0" r="110" stroke-width="1.2" />
      <circle cx="0" cy="0" r="70" stroke-width="1" stroke-dasharray="2 2" />
      <circle cx="0" cy="0" r="6" fill="currentColor" />
      
      <!-- Cross Hair Axis -->
      <line x1="0" y1="-160" x2="0" y2="160" stroke-width="1.2" />
      <line x1="-160" y1="0" x2="160" y2="0" stroke-width="1.2" />
      
      <!-- House Crest geometry -->
      <path d="M -25 15 L -25 -10 L 0 -30 L 25 -10 L 25 15 Z" stroke-width="1.8" />
    </g>

    <!-- 4. Right Side: Modular Kitchen & Bar Counter Elevation Blueprint -->
    <g transform="translate(1060, 100)" stroke-width="1.2">
      <rect x="0" y="40" width="220" height="200" rx="4" />
      <line x1="0" y1="120" x2="220" y2="120" />
      <line x1="110" y1="120" x2="110" y2="240" />
      <!-- Pendant Lights Above Counter -->
      <line x1="50" y1="0" x2="50" y2="40" />
      <polygon points="40,40 60,40 50,25" />
      <line x1="170" y1="0" x2="170" y2="40" />
      <polygon points="160,40 180,40 170,25" />
    </g>

    <!-- 5. Bottom Blueprint Scale Notation -->
    <g transform="translate(700, 365)" opacity="0.6">
      <text font-family="monospace" font-size="11" letter-spacing="3" fill="currentColor" text-anchor="middle">PRIME SPACE ARCHITECTURAL DESIGN SYSTEM &amp; FOOTER MASTERPLAN</text>
    </g>

  </g>
</svg>
