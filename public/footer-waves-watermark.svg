    <g transform="translate(420, 110)">
      <path d="M 0 -12 L 3 -3 L 12 0 L 3 3 L 0 12 L -3 3 L -12 0 L -3 -3 Z" fill="#ffffff" opacity="0.7" />
    </g>
    <g transform="translate(1120, 90)">
