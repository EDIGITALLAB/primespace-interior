<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <!-- Option 2: Smooth Luxury Architectural Wave Mesh Watermark for Footer -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    
    <!-- Flowing Wave 1 -->
    <path d="M -100 280 C 300 120 700 380 1500 180" stroke-width="1.8" opacity="0.6" />
    <path d="M -100 300 C 300 140 700 400 1500 200" stroke-width="1.4" opacity="0.5" />
    <path d="M -100 320 C 300 160 700 420 1500 220" stroke-width="1.0" opacity="0.4" />
    <path d="M -100 340 C 300 180 700 440 1500 240" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.3" />

    <!-- Flowing Wave 2 (Top Accent) -->
    <path d="M -100 100 C 400 320 800 60 1500 260" stroke-width="1.5" opacity="0.5" />
    <path d="M -100 120 C 400 340 800 80 1500 280" stroke-width="1.1" opacity="0.4" />
    
