<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <!-- Crisp White Architectural Penthouse & City Skyline Blueprint Watermark for Footer -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- CAD Axis Grid Line -->
    <line x1="0" y1="360" x2="1400" y2="360" stroke-width="1.8" opacity="0.9" />
    <line x1="0" y1="340" x2="1400" y2="340" stroke-width="1.0" stroke-dasharray="6 8" opacity="0.6" />

    <!-- Skyscraper Tower 1 (Far Left) -->
    <g transform="translate(60, 110)" stroke-width="1.4">
      <rect x="0" y="0" width="120" height="250" rx="2" />
      <line x1="30" y1="0" x2="30" y2="250" stroke-width="0.8" opacity="0.6" />
      <line x1="60" y1="0" x2="60" y2="250" stroke-width="0.8" opacity="0.6" />
      <line x1="90" y1="0" x2="90" y2="250" stroke-width="0.8" opacity="0.6" />
      <line x1="0" y1="40" x2="120" y2="40" stroke-width="0.8" opacity="0.6" />
      <line x1="0" y1="80" x2="120" y2="80" stroke-width="0.8" opacity="0.6" />
      <line x1="0" y1="120" x2="120" y2="120" stroke-width="0.8" opacity="0.6" />
      <line x1="0" y1="160" x2="120" y2="160" stroke-width="0.8" opacity="0.6" />
      <line x1="0" y1="200" x2="120" y2="200" stroke-width="0.8" opacity="0.6" />
    </g>

    <!-- Skyscraper Tower 2 (Center Left) -->
    <g transform="translate(240, 70)" stroke-width="1.4">
      <polygon points="20,0 140,0 160,30 0,30" />
      <rect x="0" y="30" width="160" height="260" rx="3" />
      <line x1="40" y1="30" x2="40" y2="290" stroke-width="0.8" opacity="0.6" />
      <line x1="80" y1="30" x2="80" y2="290" stroke-width="0.8" opacity="0.6" />
      <line x1="120" y1="30" x2="120" y2="290" stroke-width="0.8" opacity="0.6" />
    </g>

    <!-- Main High-Rise Spire Penthouse Tower (Center) -->
    <g transform="translate(570, 30)" stroke-width="1.6">
      <!-- Antenna Spire -->
      <line x1="130" y1="-25" x2="130" y2="0" stroke-width="2.5" />
      <circle cx="130" cy="-25" r="4" fill="#ffffff" />
      
      <!-- Crown Top -->
      <polygon points="30,0 230,0 210,35 50,35" />
      <rect x="50" y="35" width="160" height="295" rx="4" />
      
      <!-- Architectural Radial Grid & Axis -->
      <line x1="130" y1="35" x2="130" y2="330" stroke-width="1" stroke-dasharray="4 4" opacity="0.7" />
      <circle cx="130" cy="115" r="38" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.85" />
      <circle cx="130" cy="115" r="6" fill="#ffffff" />
    </g>

    <!-- Skyscraper Tower 4 (Center Right) -->
    <g transform="translate(980, 80)" stroke-width="1.4">
      <rect x="0" y="0" width="150" height="280" rx="3" />
      <line x1="38" y1="0" x2="38" y2="280" stroke-width="0.8" opacity="0.6" />
      <line x1="75" y1="0" x2="75" y2="280" stroke-width="0.8" opacity="0.6" />
      <line x1="112" y1="0" x2="112" y2="280" stroke-width="0.8" opacity="0.6" />
    </g>

    <!-- Skyscraper Tower 5 (Far Right) -->
    <g transform="translate(1190, 120)" stroke-width="1.4">
      <rect x="0" y="0" width="140" height="240" rx="3" />
      <line x1="35" y1="0" x2="35" y2="240" stroke-width="0.8" opacity="0.6" />
      <line x1="70" y1="0" x2="70" y2="240" stroke-width="0.8" opacity="0.6" />
      <line x1="105" y1="0" x2="105" y2="240" stroke-width="0.8" opacity="0.6" />
    </g>

    <!-- Architectural CAD Scale Legend -->
    <g transform="translate(700, 385)">
      <text font-family="monospace" font-size="11" font-weight="bold" letter-spacing="3.5" fill="#ffffff" text-anchor="middle" opacity="0.75">METROPOLITAN ARCHITECTURE &amp; SKYLINE CAD WATERMARK</text>
    </g>

  </g>
</svg>
