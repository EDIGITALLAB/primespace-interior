<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <!-- High-Visibility Luxury Geometric Monogram & Starburst Crest Watermark - Dynamic Theme Color -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Concentric Radial Luxury Rings -->
    <g transform="translate(700, 380)">
      <circle cx="0" cy="0" r="260" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6" />
      <circle cx="0" cy="0" r="220" stroke-width="1.8" opacity="0.75" />
      <circle cx="0" cy="0" r="170" stroke-width="2" stroke-dasharray="4 6" opacity="0.8" />
      <circle cx="0" cy="0" r="110" stroke-width="2.5" opacity="0.9" />
      <circle cx="0" cy="0" r="40" stroke-width="2.2" opacity="0.95" />
      
      <!-- 8-Point Starburst Rays -->
      <line x1="0" y1="-280" x2="0" y2="280" stroke-width="1.8" opacity="0.7" />
      <line x1="-280" y1="0" x2="280" y2="0" stroke-width="1.8" opacity="0.7" />
      <line x1="-198" y1="-198" x2="198" y2="198" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
      <line x1="-198" y1="198" x2="198" y2="-198" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

      <!-- Center House Icon Geometry (Brand Crest) -->
      <path d="M -30 20 L -30 -10 L 0 -35 L 30 -10 L 30 20 Z" stroke-width="2.8" opacity="0.95" />
      <circle cx="0" cy="-5" r="8" stroke-width="2" opacity="0.9" />

      <!-- Outer Diamond Accents -->
      <polygon points="0,-220 15,-205 0,-190 -15,-205" stroke-width="2" opacity="0.85" />
      <polygon points="0,220 15,205 0,190 -15,205" stroke-width="2" opacity="0.85" />
      <polygon points="-220,0 -205,15 -190,0 -205,-15" stroke-width="2" opacity="0.85" />
      <polygon points="220,0 205,15 190,0 205,-15" stroke-width="2" opacity="0.85" />
    </g>

  </g>
</svg>
